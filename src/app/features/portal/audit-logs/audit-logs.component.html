<div class="portal-section">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h2 style="color: var(--tjr-bronze); margin: 0;">Security Event Logs</h2>
    <button (click)="refreshLogs()" [disabled]="loading()" class="tjr-btn tjr-btn-primary" style="padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.5rem;">
      <span *ngIf="loading()" style="font-size: 1.2rem;">↻</span>
      <span *ngIf="!loading()">Refresh</span>
    </button>
  </div>

  <div style="border: 1px solid var(--card-border); border-radius: var(--radius-md); overflow-x: auto; background: var(--card-bg);">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
      <thead style="background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--card-border);">
        <tr>
          <th style="padding: 1rem; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Status</th>
          <th style="padding: 1rem; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Command</th>
          <th style="padding: 1rem; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Risk Score</th>
          <th style="padding: 1rem; font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600;">Policy/Reason</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ev of logs()" style="border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.02)'" onmouseout="this.style.background='transparent'">
          <td style="padding: 1rem; white-space: nowrap;">
            <span *ngIf="ev.allowed" style="font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.75rem; border-radius: 999px; background: rgba(0, 255, 0, 0.1); color: var(--tjr-success); border: 1px solid rgba(0, 255, 0, 0.2);">
              Approved
            </span>
            <span *ngIf="!ev.allowed" style="font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.75rem; border-radius: 999px; background: rgba(255, 68, 68, 0.1); color: var(--tjr-error); border: 1px solid rgba(255, 68, 68, 0.2);">
              Denied
            </span>
          </td>
          <td style="padding: 1rem;">
            <code style="font-family: monospace; font-size: 0.85rem; color: var(--text-secondary); background: rgba(0,0,0,0.5); padding: 0.25rem 0.5rem; border-radius: 4px;">{{ ev.command }}</code>
          </td>
          <td style="padding: 1rem; white-space: nowrap;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <div style="width: 100px; background: rgba(0,0,0,0.5); border-radius: 999px; height: 8px;">
                <div style="height: 100%; border-radius: 999px;" 
                     [ngStyle]="{'width': (ev.risk_score * 10) + '%', 'background': ev.risk_score < 4 ? 'var(--tjr-success)' : (ev.risk_score >= 8 ? 'var(--tjr-error)' : 'var(--tjr-warning)')}"></div>
              </div>
              <span style="font-size: 0.85rem; color: var(--text-muted);">{{ ev.risk_score }}/10</span>
            </div>
          </td>
          <td style="padding: 1rem; font-size: 0.9rem; color: var(--text-muted); max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="{{ ev.reason }}">
            {{ ev.reason }}
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="logs().length === 0 && !loading()" style="padding: 3rem; text-align: center; color: var(--text-muted);">
      No security events found in the audit trail.
    </div>
    
    <div *ngIf="loading() && logs().length === 0" style="padding: 3rem; text-align: center; color: var(--tjr-bronze);">
      Connecting to Federation logs...
    </div>
  </div>
</div>
