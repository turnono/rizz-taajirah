<div class="portal-section">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <div>
      <h2 style="color: var(--tjr-bronze); margin-bottom: 0.5rem;">POPIA Compliance Reports</h2>
      <p style="color: var(--text-secondary); margin: 0;">Automated compliance summaries from Sentinel audits</p>
    </div>
    <button (click)="generateNewReport()" [disabled]="generating" class="tjr-btn tjr-btn-primary" style="padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
      <span *ngIf="generating" style="font-size: 1.2rem;">⟳</span>
      <span>Generate New Report</span>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 1.5rem;">
    <div *ngIf="loading() && reports().length === 0" style="grid-column: 1 / -1; padding: 3rem; text-align: center; color: var(--tjr-bronze);">
      Fetching reports...
    </div>

    <div *ngIf="!loading() && reports().length === 0" style="grid-column: 1 / -1; padding: 3rem; text-align: center; color: var(--text-muted); border: 1px dashed rgba(192, 125, 62, 0.3); border-radius: var(--radius-md);">
      No compliance reports have been generated yet.
    </div>

    <!-- Report Cards -->
    <div *ngFor="let report of reports()" class="tjr-card hover-grow" style="position: relative; display: flex; flex-direction: column; justify-content: space-between;">
      
      <!-- Header Area -->
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
        <div style="display: flex; align-items: center; gap: 0.75rem; color: var(--tjr-bronze);">
          <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
          <span style="font-weight: 600; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;" title="{{ report.id }}">{{ report.id }}</span>
        </div>
        
        <!-- Status Badge -->
        <span *ngIf="report.status === 'COMPLIANT'" style="font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.75rem; border-radius: 999px; background: rgba(0, 255, 0, 0.1); color: var(--tjr-success); border: 1px solid rgba(0, 255, 0, 0.2);">
          Compliant
        </span>
        <span *ngIf="report.status !== 'COMPLIANT'" style="font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.75rem; border-radius: 999px; background: rgba(255, 68, 68, 0.1); color: var(--tjr-error); border: 1px solid rgba(255, 68, 68, 0.2);">
          Review Needed
        </span>
      </div>

      <!-- Content Area -->
      <div style="margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem;">
        <p style="display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--text-muted); margin: 0;">
          <span>Generated:</span>
          <span style="color: var(--text-secondary);">{{ formatDate(report.generated_at) }}</span>
        </p>
      </div>

      <div style="margin-top: 1.5rem;">
        <button class="tjr-btn tjr-btn-outline" style="width: 100%; padding: 0.5rem; text-align: center;">
          View Report (Demo)
        </button>
      </div>
    </div>
  </div>
</div>
