<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, rgba(13,79,74,0.15) 0%, transparent 60%);">
  <div class="tjr-card" style="width: 100%; max-width: 400px; padding: 2.5rem; text-align: center;">
    
    <div style="margin-bottom: 2rem;">
      <h1 style="color: var(--tjr-bronze); font-size: 1.8rem; margin-bottom: 0.5rem;">Sovereign Portal</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Federation Access Point</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage()" style="background: rgba(255, 68, 68, 0.1); border: 1px solid rgba(255, 68, 68, 0.3); color: var(--tjr-error); padding: 0.75rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; font-size: 0.9rem; text-align: left;">
      {{ errorMessage() }}
    </div>

    <form (ngSubmit)="login()" style="display: flex; flex-direction: column; gap: 1.25rem;">
      
      <div style="text-align: left;">
        <label for="email" style="display: block; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem;">Secure Email</label>
        <input 
          id="email" 
          type="email" 
          name="email"
          [(ngModel)]="email"
          required
          placeholder="Enter authorized email"
          style="width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border); border-radius: 4px; padding: 0.75rem; color: #fff; font-family: inherit; font-size: 1rem; outline: none; transition: border-color 0.2s; box-sizing: border-box;"
          onfocus="this.style.borderColor='var(--tjr-bronze)'" 
          onblur="this.style.borderColor='var(--card-border)'"
        >
      </div>

      <div style="text-align: left;">
        <label for="password" style="display: block; color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem;">Access Key</label>
        <input 
          id="password" 
          type="password" 
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Enter your password"
          style="width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border); border-radius: 4px; padding: 0.75rem; color: #fff; font-family: inherit; font-size: 1rem; outline: none; transition: border-color 0.2s; box-sizing: border-box;"
          onfocus="this.style.borderColor='var(--tjr-bronze)'" 
          onblur="this.style.borderColor='var(--card-border)'"
        >
      </div>

      <button 
        type="submit" 
        [disabled]="loading() || !email() || !password()" 
        class="tjr-btn tjr-btn-primary" 
        [style.opacity]="loading() || !email() || !password() ? '0.6' : '1'"
        [style.cursor]="loading() || !email() || !password() ? 'not-allowed' : 'pointer'"
        style="width: 100%; padding: 0.8rem; margin-top: 0.5rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem;"
      >
        <span *ngIf="loading()" style="font-size: 1.2rem; transform: rotate(180deg); transition: transform 0.5s;">↻</span>
        <span>Authenticate</span>
      </button>

    </form>
    
    <div style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted);">
      Sentinel Federation Protected Area.<br>Unauthorized access is logged and prosecuted.
    </div>

  </div>
</div>
