<!-- Mathematics Overlay -->
<div class="mathematics-overlay">
  <div *ngFor="let symbol of mathFormulas" class="math-formula" [style.top.%]="symbol.top" [style.left.%]="symbol.left"
    [style.color]="symbol.color" [style.opacity]="symbol.opacity"
    [style.transform]="'rotate(' + symbol.rotation + 'deg)'">
    {{ symbol.text }}
  </div>
</div>

<router-outlet />
